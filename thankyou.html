<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cảm ơn bạn!</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #56ccf2, #FF99CC);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .thank-box {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 40px 55px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            animation: fadeIn 0.7s ease;
        }

        .thank-box h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color :#FF6699  ;
        }

        .thank-box p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .thank-box a {
            text-decoration: none;
            color: #2f80ed;
            background: #fff;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .thank-box a:hover {
            background: #dfe9ff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="thank-box">
        <h1>Cảm ơn bạn!</h1>
        <p>Chúng tôi đã nhận được thông tin.  
        Chúng tôi sẽ liên hệ với bạn sớm nhất.</p>

        <a href="abcxyz.html">Quay lại trang liên hệ</a>
    </div>

</body>
</html>

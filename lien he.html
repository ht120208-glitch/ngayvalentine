<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Liên Hệ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .contact-form {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 320px;
        }
        .contact-form h2 {
            margin-bottom: 15px;
            text-align: center;
        }
        .contact-form input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .contact-form button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .contact-form button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <form action="camonlh.html" method="post">
    <form class="contact-form">
        <h2>Liên Hệ</h2>

        <input type="text" placeholder="Họ và tên" required>
        <input type="tel" placeholder="Số điện thoại" required>
        <input type="email" placeholder="Gmail" required>

        <button type="submit">Liên hệ</button>
    </form>

</body>
</html>
